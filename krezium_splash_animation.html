<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kredit — Splash Animation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { width: 100%; height: 100%; background: #050505; overflow: hidden }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 48px;
  }

  .logo-wrap {
    width: min(80vw, 560px);
    user-select: none;
  }

  svg { display: block; width: 100%; height: auto; overflow: visible }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    background: transparent;
    color: rgba(250,250,251,.55);
    border: 1px solid rgba(250,250,251,.15);
    border-radius: 8px;
    padding: 9px 20px;
    font: 13px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: .06em;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .btn:hover {
    color: #fafafb;
    border-color: rgba(250,250,251,.4);
    background: rgba(250,250,251,.05);
  }

  .speed-label {
    font: 12px/1 -apple-system, system-ui, sans-serif;
    color: rgba(250,250,251,.3);
    letter-spacing: .05em;
  }
</style>
</head>

<div class="stage">
  <div class="logo-wrap">
    <svg id="logo" viewBox="0 0 1824 309" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <g fill="#030202"></g>
      <g fill="#fafafb" id="paths"></g>
    </svg>
  </div>
  <div class="controls">
    <span class="speed-label">velocidad</span>
    <button class="btn" onclick="setSpeed(2)">0.5×</button>
    <button class="btn" onclick="setSpeed(1)">1×</button>
    <button class="btn" onclick="setSpeed(0.5)">2×</button>
    <button class="btn" onclick="play()">↺ replay</button>

</div>

// ── Animation plan: [rawIndex, direction, t0, t1] ─────────────────────────
// dir: 'bt' = bottom→top  |  'lr' = left→right
const ANIM = [
  [10,'bt',0.00,0.22], // K stem
  [11,'lr',0.04,0.24], // K upper arm
  [ 2,'bt',0.06,0.28], // K lower
  [ 0,'bt',0.20,0.42], // R body
  [ 1,'lr',0.26,0.46], // R leg
  [15,'lr',0.38,0.56], // E top bar
  [14,'lr',0.40,0.58], // E top-right
  [ 9,'lr',0.42,0.60], // E middle
  [ 6,'lr',0.44,0.62], // E btm-left
  [ 7,'lr',0.46,0.64], // E btm-right
  [ 8,'bt',0.58,0.78], // D left
  [ 3,'bt',0.62,0.82], // D right
  [ 4,'bt',0.76,0.92], // I stem
  [12,'lr',0.82,0.96], // T bar-left
  [13,'lr',0.86,1.00], // T bar-right
  [ 5,'bt',0.84,0.98], // T stem
];

const BASE_DURATION = 2300;
let speedMul = 1;   // 1 = normal, 2 = half-speed, 0.5 = double-speed

const ns = 'http://www.w3.org/2000/svg';
let pathEls = [], clipRects = [], boxes = [];
let initialized = false, rafId, startTime;

function easeInOut(t) { return t<.5 ? 4*t*t*t : 1-((-2*t+2)**3)/2 }
function easeOut(t)   { return 1-(1-t)**3 }

function build() {
  document.getElementById('defs').innerHTML = '';
  document.getElementById('paths').innerHTML = '';
  pathEls = []; clipRects = []; boxes = [];

  RAW.forEach((d, i) => {
    const cp = document.createElementNS(ns,'clipPath');
    cp.id = 'cp'+i;
    const r = document.createElementNS(ns,'rect');
    r.setAttribute('x',0); r.setAttribute('y',0);
    r.setAttribute('width',0); r.setAttribute('height',0);
    cp.appendChild(r);
    document.getElementById('defs').appendChild(cp);
    clipRects.push(r);

    const p = document.createElementNS(ns,'path');
    p.setAttribute('d', d);
    p.setAttribute('clip-path',`url(#cp${i})`);
    document.getElementById('paths').appendChild(p);
    pathEls.push(p);
  });

  requestAnimationFrame(() => {
    pathEls.forEach((p,i) => {
      try { boxes[i] = p.getBBox() } catch(e) { boxes[i]={x:0,y:0,width:0,height:0} }
    });
    initialized = true;
    resetClips();
    startTime = null;
    rafId = requestAnimationFrame(tick);
  });
}

function resetClips() {
  ANIM.forEach(([si,dir]) => {
    const r = clipRects[si], b = boxes[si]||{x:0,y:0,width:0,height:0}, p = 2;
    if (dir==='bt') {
      r.setAttribute('x', b.x-p); r.setAttribute('y', b.y+b.height+p);
      r.setAttribute('width', b.width+p*2); r.setAttribute('height', 0);
    } else {
      r.setAttribute('x', b.x-p); r.setAttribute('y', b.y-p);
      r.setAttribute('width', 0); r.setAttribute('height', b.height+p*2);
    }
  });
}

function setClip(si, dir, t) {
  const r = clipRects[si], b = boxes[si]||{x:0,y:0,width:0,height:0}, p = 2;
  if (dir==='bt') {
    const h = b.height*t;
    r.setAttribute('x', b.x-p); r.setAttribute('y', b.y+b.height-h-p);
    r.setAttribute('width', b.width+p*2); r.setAttribute('height', h+p*2);
  } else {
    r.setAttribute('x', b.x-p); r.setAttribute('y', b.y-p);
    r.setAttribute('width', b.width*t+p*2); r.setAttribute('height', b.height+p*2);
  }
}

function tick(ts) {
  if (!startTime) startTime = ts;
  const dur = BASE_DURATION * speedMul;
  const progress = easeInOut(Math.min(1,(ts-startTime)/dur));
  ANIM.forEach(([si,dir,t0,t1]) => {
    const raw = Math.max(0, Math.min(1,(progress-t0)/(t1-t0)));
    setClip(si, dir, easeOut(raw));
  });
  if (ts-startTime < dur+100) rafId = requestAnimationFrame(tick);
}

function play() {
  cancelAnimationFrame(rafId);
  if (!initialized) { build(); return; }
  resetClips();
  startTime = null;
  rafId = requestAnimationFrame(tick);
}

function setSpeed(mul) { speedMul = mul; play(); }

build();
</script>
